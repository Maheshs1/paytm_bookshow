spring:
  application:
    name: bookshow
  flyway:
    enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
#    open-in-view: false
#    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true

logging:
  level:
    org:
      flywaydb: DEBUG
#      hibernate:
#        orm:
#          jdbc:
#            bind: trace

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

    group:
      liveness:
        include:
          - livenessState

      readiness:
        include:
          - readinessState
          - db
